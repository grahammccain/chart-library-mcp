# Chart Library MCP: the same three-tool public menu as the hosted service.
name: chart-library
version: 6.2.0
description: >
  Free market-state research through three independent read-only tools:
  market_state, daily_note, and research_quality. Read completed-session
  states and historical analog ranges, published daily research, or the
  dated calibration receipt. No API key or preliminary search is needed.
  Historical observations are not automatically calibrated forecasts.
  For custom integrations, contact graham@chartlibrary.io.

homepage: https://chartlibrary.io
repository: https://github.com/grahammccain/chart-library-mcp

# Install chartlibrary-mcp from PyPI, then launch its console entry point.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      CHART_LIBRARY_API_KEY:
        type: string
        title: API key
        description: >
          Optional. Public research works without a key.
          Service limits and underlying data terms still apply.
  commandFunction: |-
    (config) => ({
      command: "chartlibrary-mcp",
      args: [],
      env: {
        CHART_LIBRARY_API_KEY: config.CHART_LIBRARY_API_KEY || ""
      }
    })

# Existing tool names remain callable. The advanced local profile changes
# discovery only; it does not grant access to private research.
tools:
  - name: market_state
    annotation: read_only
  - name: daily_note
    annotation: read_only
  - name: research_quality
    annotation: read_only
