# Smithery server config — https://smithery.ai
#
# Chart Library MCP — chart-pattern intelligence for agents.
# 9 canonical tools backed by 25M+ embeddings, 19K+ symbols,
# 10 years of US equity history. Output is a calibrated
# distribution of historical analogs, not a forecast.

name: chart-library
version: 6.0.0
description: >
  Chart-pattern intelligence for AI agents. 9 canonical tools
  (search, cohort_analyze, cohort_introspect, symbol_intelligence,
  analyze, context, explain, portfolio, report_feedback) plus a
  full-cohort handover surface (cohort_members, cohort_groupby,
  cohort_rerank) backed by 25M+ embeddings, 19K+ symbols, 10y US
  equity history. The core loop is search → cohort_analyze →
  cohort_introspect: anchor a (symbol, date, timeframe), get the
  cohort of historical analogs, then slice it. Calibrated
  distributions, not forecasts.

homepage: https://chartlibrary.io
repository: https://github.com/grahammccain/chart-library-mcp

# Local stdio install path — Smithery installs from PyPI
# (already published as `chartlibrary-mcp`) and launches the
# `chartlibrary-mcp` console script entry point.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      CHART_LIBRARY_API_KEY:
        type: string
        title: API key
        description: >
          Free Sandbox key gives 200 calls/day on search +
          context. Get one at https://chartlibrary.io/developers.
          Optional — the server runs without a key but deeper
          tools (cohort_analyze, cohort_introspect, explain)
          require auth.
  commandFunction: |-
    (config) => ({
      command: "chartlibrary-mcp",
      args: [],
      env: {
        CHART_LIBRARY_API_KEY: config.CHART_LIBRARY_API_KEY || ""
      }
    })

# Tool surface — 9 canonical + 3 handover; deprecated umbrella
# wrappers (cohort, discover, narrative, decision_brief) stay
# callable but are not advertised here. Read-only tools auto-allow
# in safe-mode MCP clients. The core loop is search → cohort_analyze
# → cohort_introspect for any (symbol, date) anchor question.
tools:
  - name: search
    annotation: read_only
  - name: cohort_analyze
    annotation: read_only
  - name: cohort_introspect
    annotation: read_only
  - name: symbol_intelligence
    annotation: read_only
  - name: analyze
    annotation: read_only
  - name: context
    annotation: read_only
  - name: explain
    annotation: read_only
  - name: portfolio
    annotation: read_only
  - name: report_feedback
    annotation: write
  - name: cohort_members
    annotation: read_only
  - name: cohort_groupby
    annotation: read_only
  - name: cohort_rerank
    annotation: read_only
