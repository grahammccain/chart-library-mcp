[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chartlibrary-mcp"
version = "3.2.0"
description = "Chart Library MCP Server — intelligence layer for stock pattern agents. 16 tools across cohort retrieval (search, cohort, cohort_analyze), Layer 5 memory (symbol_intelligence, similar_cohorts, cohort_compare, discover_picks), and analysis (analyze, context, explain, portfolio, anchor_fetch, decompose, clusters, live_search). Conditional distributions, conformal bands, FinBERT news sentiment + narrative_change_score, validated 14-19pp quintile spread."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Chart Library", email = "graham@chartlibrary.io"},
]
keywords = ["mcp", "chart patterns", "stock analysis", "AI agent", "trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://chartlibrary.io"
Documentation = "https://chartlibrary.io/developers"
Repository = "https://github.com/grahammccain/chart-library-mcp"

[project.scripts]
chartlibrary-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]
