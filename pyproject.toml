[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chartlibrary-mcp"
version = "3.4.0"
description = "Chart Library MCP Server — historical pattern intelligence for AI agents. 20 tools spanning cohort retrieval (search, cohort, cohort_analyze), Layer 5 memory (symbol_intelligence, similar_cohorts, cohort_compare, discover_picks), realtime News v2 (narrative_pulse, narrative_alerts), single-call agent surface (get_daily_setups), analysis (analyze, context, explain, portfolio, anchor_fetch, decompose, clusters, live_search), and feedback (report_feedback). 25M+ patterns across 19K+ symbols, 10 years. Combined conviction = cohort_score + news pulse boost. Q5-Q1 directional spread +14.7pp on n=1,260 5-day cohort observations."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Chart Library", email = "graham@chartlibrary.io"},
]
keywords = ["mcp", "chart patterns", "stock analysis", "AI agent", "trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://chartlibrary.io"
Documentation = "https://chartlibrary.io/developers"
Repository = "https://github.com/grahammccain/chart-library-mcp"

[project.scripts]
chartlibrary-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]
