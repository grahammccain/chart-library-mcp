[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chartlibrary-mcp"
version = "3.1.0"
description = "Chart Library MCP Server — intelligence layer for stock pattern agents. 12 tools: search, cohort, cohort_analyze (Layer 3 V5 retrieval + Layer 2 metadata join: regime, news sentiment via FinBERT, narrative_change_score), analyze, context, explain, portfolio, anchor_fetch, decompose, clusters, live_search, report_feedback. Conditional distributions with conformal-calibrated quantile bands, catalyst-aware metadata, per-cohort decomposition + clustering, and outcome-distribution + per-feature importance analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Chart Library", email = "graham@chartlibrary.io"},
]
keywords = ["mcp", "chart patterns", "stock analysis", "AI agent", "trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://chartlibrary.io"
Documentation = "https://chartlibrary.io/developers"
Repository = "https://github.com/grahammccain/chart-library-mcp"

[project.scripts]
chartlibrary-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]
