[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chartlibrary-mcp"
version = "6.2.0"
description = "Free market-state research through three independent read-only tools: market_state, daily_note, and research_quality. Historical analogs, published research, and calibration evidence; no API key needed to try."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Chart Library", email = "graham@chartlibrary.io"}]
keywords = ["mcp", "market states", "research", "historical analogs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=1.28.1,<2.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://chartlibrary.io"
Documentation = "https://chartlibrary.io/developers"
Repository = "https://github.com/grahammccain/chart-library-mcp"

[project.scripts]
chartlibrary-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server", "lexicon", "public_research"]
