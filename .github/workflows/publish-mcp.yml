name: Publish to MCP Registry

# Registers chartlibrary-mcp in the official MCP Registry
# (registry.modelcontextprotocol.io) via GitHub OIDC — the repo's OIDC token
# proves ownership of the io.github.grahammccain namespace, so no interactive
# login or stored secret is needed. The PyPI package (chartlibrary-mcp) is
# published separately; this only registers the server entry, which then
# cascades to PulseMCP / Glama / mcp.so / the GitHub registry via their ETL.
#
# Trigger: manually (workflow_dispatch) or by pushing a vX.Y.Z tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC authentication
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
